<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LDH Girls TOP9決定戦</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111, #444);
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .candidate {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .candidate img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
    }

    .number {
      color: #888;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

</html>
